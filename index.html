<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CoreGG is a gaming hub featuring Minecraft Java Edition and Bedrock Edition, alongside other game experiences.">
    <meta name="theme-color" content="#080812">
    <meta name="robots" content="index,follow">
    <title>CoreGG - Gaming Hub</title>
    <style>
        :root {
            /* Core Theme Colors */
            --bg-deep-blue: #080812;
            --bg-gold-tint: #180d25;
            
            /* Neon Accents */
            --neon-gold: #FFD700;
            --neon-gold-glow: rgba(255, 215, 0, 0.8);
            
            --neon-green: #32CD32;
            --neon-green-glow: rgba(50, 205, 50, 0.8);
            
            --neon-cyan: #a78bfa;
            --neon-cyan-glow: rgba(167, 139, 250, 0.62);

            --ui-dark: rgba(10, 9, 20, 0.92);
            --ui-border: rgba(167, 139, 250, 0.22); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep-blue);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Base solid gradient behind everything */
        .base-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(ellipse at 18% 18%, rgba(124, 58, 237, 0.16), transparent 42%), linear-gradient(135deg, #080812 0%, #11101f 52%, #180d25 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Full viewport image container */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1);
            transition: opacity 0.55s ease, transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: opacity, transform;
        }

        /* Keep CoreGG Neon Gaming Emblem.png beside this HTML file. */
        #bg-idle {
            opacity: 0.22;
            background-image: url('./CoreGG%20Neon%20Gaming%20Emblem.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 0 18px rgba(167, 139, 250, 0.30));
            transition: opacity 0.45s ease, filter 0.45s ease;
        }

        .bg-container.is-hovering #bg-idle {
            opacity: 0;
            filter: none;
        }

        #bg-genshin {
            background-image: url('https://cdn1.epicgames.com/spt-assets/99dc46c68ea14324964a856d18dcac5b/genshin-impact-1hm6x.jpg');
        }

        #bg-minecraft {
            background-image: url('https://media-cdn.tripadvisor.com/media/photo-o/15/88/be/67/i-love-minecraft.jpg');
        }

        .bg-container::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(8, 8, 18, 0.18), rgba(8, 8, 18, 0.40));
            pointer-events: none;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2;
            background-image: 
                linear-gradient(rgba(167, 139, 250, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(167, 139, 250, 0.045) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .header-strip {
            width: 100%;
            height: 60px;
            background: linear-gradient(90deg, rgba(0, 5, 15, 0.9) 0%, rgba(0, 20, 40, 0.4) 100%);
            border-bottom: 1px solid var(--ui-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05); 
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .header-logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--neon-gold); 
            text-shadow: 0 0 8px var(--neon-gold-glow);
            text-transform: uppercase;
        }

        .header-nav {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            padding: 6px 12px;
            border: 1px solid transparent;
            border-radius: 4px;
        }

        .nav-link:hover {
            color: var(--neon-gold);
            text-shadow: 0 0 8px var(--neon-gold-glow);
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
        }

        .nav-link.support-tab {
            color: var(--neon-gold);
            border: 1px solid var(--neon-gold);
            padding: 6px 18px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2), inset 0 0 5px rgba(255, 215, 0, 0.1);
            background: rgba(255, 215, 0, 0.05);
            text-shadow: 0 0 5px var(--neon-gold-glow);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); 
            border-radius: 2px;
        }

        .nav-link.support-tab:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5), inset 0 0 10px rgba(255, 215, 0, 0.3);
            color: #fff;
        }

        .footer-strip {
            width: 100%;
            height: 45px;
            background: rgba(0, 5, 10, 0.85);
            border-top: 1px solid var(--ui-border);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .footer-text {
            font-size: 13px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px; 
        }

        .wheel-wrapper {
            position: relative;
            width: 90vw;
            max-width: 420px; 
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.8));
        }

        .wheel-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .half-group {
            transform-origin: 300px 300px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
            cursor: pointer;
        }

        .half-path {
            fill: var(--ui-dark);
            stroke-width: 2.5;
            transition: fill 0.4s ease, stroke 0.4s ease;
        }

        .half-genshin .half-path { stroke: var(--neon-gold); }
        .half-genshin:hover {
            transform: scale(1.06) translateX(-6px);
            filter: drop-shadow(0 0 25px var(--neon-gold-glow));
        }
        .half-genshin:hover .half-path { fill: rgba(255, 215, 0, 0.1); }
        .half-genshin:hover .logo-img { filter: grayscale(0%) brightness(1.2); }

        .half-minecraft .half-path { stroke: var(--neon-green); }
        .half-minecraft:hover {
            transform: scale(1.06) translateX(6px);
            filter: drop-shadow(0 0 25px var(--neon-green-glow));
        }
        .half-minecraft:hover .half-path { fill: rgba(50, 205, 50, 0.1); }
        .half-minecraft:hover .logo-img { filter: grayscale(0%) brightness(1.2); }

        .logo-img {
            transition: filter 0.4s ease;
            filter: grayscale(40%) brightness(0.8); 
        }

        @keyframes spin-cw { 100% { transform: rotate(360deg); } }
        @keyframes spin-ccw { 100% { transform: rotate(-360deg); } }
        @keyframes pulse-core {
            0%, 100% { filter: drop-shadow(0 0 10px var(--neon-cyan-glow)); }
            50% { filter: drop-shadow(0 0 25px var(--neon-cyan)); }
        }

        .ring-fast { transform-origin: 300px 300px; animation: spin-cw 12s linear infinite; }
        .ring-slow { transform-origin: 300px 300px; animation: spin-ccw 25s linear infinite; }
        .ring-med { transform-origin: 300px 300px; animation: spin-cw 18s linear infinite; }
        .core-pulse { transform-origin: 300px 300px; animation: pulse-core 3s ease-in-out infinite; }

        .dynamic-box {
            padding: 8px 30px;
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.02) 0%, rgba(4, 10, 24, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 0 0 15px 15px; 
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: center;
            min-width: 220px;
            position: relative;
            z-index: 2;
        }

        .dynamic-box::before {
            content: '';
            position: absolute;
            top: 0; left: 50%; transform: translateX(-50%);
            width: 50%; height: 2px;
            background: var(--neon-gold);
            box-shadow: 0 0 10px var(--neon-gold-glow);
            transition: all 0.4s ease;
            opacity: 0.5;
        }

        .dynamic-box.active-genshin {
            color: var(--neon-gold);
            border-color: rgba(255, 215, 0, 0.1);
            border-top-color: var(--neon-gold);
            text-shadow: 0 0 10px var(--neon-gold-glow);
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.05) 0%, rgba(10, 9, 20, 0.92) 100%);
        }
        .dynamic-box.active-genshin::before {
            background: var(--neon-gold);
            box-shadow: 0 0 10px var(--neon-gold-glow);
            width: 80%;
            opacity: 1;
        }

        .dynamic-box.active-minecraft {
            color: var(--neon-green);
            border-color: rgba(50, 205, 50, 0.1);
            border-top-color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green-glow);
            background: linear-gradient(180deg, rgba(50, 205, 50, 0.05) 0%, rgba(10, 9, 20, 0.92) 100%);
        }
        .dynamic-box.active-minecraft::before {
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green-glow);
            width: 80%;
            opacity: 1;
        }


        /* Minecraft edition picker: compact green split options that leave the wheel artwork intact. */
        .wheel-wrapper {
            transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-origin: center;
        }

        .wheel-container.minecraft-menu-open .wheel-wrapper {
            transform: scale(0.88);
        }

        .picker-panel {
            width: min(78vw, 360px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: -16px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-8px) scale(0.97);
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.24s ease, transform 0.28s ease, visibility 0.28s, max-height 0.3s ease;
            position: relative;
            z-index: 4;
        }

        .picker-panel.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
            max-height: 140px;
        }

        .picker-heading {
            color: #baffba;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 3px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(50, 205, 50, 0.3);
        }

        .picker-options {
            display: flex;
            width: 100%;
            gap: 8px;
        }

        .edition-option {
            flex: 1;
            min-width: 0;
            min-height: 46px;
            border: 1px solid rgba(50, 205, 50, 0.7);
            border-radius: 10px;
            color: #d9ffd9;
            background: linear-gradient(145deg, rgba(14, 46, 22, 0.96), rgba(5, 15, 10, 0.96));
            box-shadow: inset 0 0 12px rgba(50, 205, 50, 0.08), 0 0 12px rgba(50, 205, 50, 0.08);
            font: inherit;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .edition-option:hover,
        .edition-option:focus-visible {
            color: #fff;
            border-color: #32CD32;
            background: rgba(30, 100, 40, 0.92);
            box-shadow: 0 0 18px rgba(50, 205, 50, 0.25);
            transform: translateY(-2px);
            outline: none;
        }

        .edition-option:active { transform: scale(0.98); }

        /* Responsive polish: preserve the neon motion while adapting to touch screens. */
        #genshin-link {
            cursor: pointer;
            pointer-events: all;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .half-group {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            outline: none;
            cursor: pointer;
            pointer-events: all;
        }

        .half-group .half-path,
        .half-group .logo-img,
        .half-group circle {
            pointer-events: all;
        }

        .wheel-svg {
            touch-action: manipulation;
        }

        .half-group:focus-visible .half-path {
            stroke-width: 4;
        }

        @media (hover: hover) and (pointer: fine) {
            .half-genshin:hover,
            .half-minecraft:hover {
                transform: scale(1.045);
            }
        }

        @media (max-width: 700px) {
            /* On phones, keep Genshin's focal point centered and reveal the image
               outward from the middle instead of making it feel like it slides in sideways. */
            #bg-genshin {
                background-position: 50% 50%;
                background-size: cover;
                transform-origin: 50% 50%;
                clip-path: circle(0% at 50% 50%);
                transition: opacity 0.55s ease, transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                            clip-path 0.7s ease-out;
            }

            .bg-container.is-hovering #bg-genshin {
                clip-path: circle(150% at 50% 50%);
            }

            .header-strip {
                height: 56px;
                padding: 0 18px;
            }

            .header-logo {
                font-size: 17px;
                letter-spacing: 4px;
            }

            .header-nav { gap: 8px; }

            .nav-link {
                font-size: 11px;
                letter-spacing: 1.5px;
                padding: 7px 10px;
            }

            .nav-link.support-tab { padding: 7px 12px; }

            .main-content {
                padding: 12px 10px;
                min-height: 0;
            }

            .wheel-container {
                width: 100%;
                gap: 8px;
            }

            .wheel-wrapper {
                width: min(88vw, 420px, 52vh);
                max-width: 420px;
                flex-shrink: 0;
            }

            .picker-panel { width: min(84vw, 320px); margin-top: -18px; gap: 7px; }
            .picker-heading { font-size: 9px; letter-spacing: 2px; }
            .picker-options { gap: 7px; }

            .edition-option {
                min-height: 44px;
                font-size: 10px;
                letter-spacing: 1.2px;
                padding: 8px 4px;
            }

            .dynamic-box {
                width: min(82vw, 300px);
                min-width: 0;
                padding: 10px 14px;
                font-size: 11px;
                letter-spacing: 3px;
            }

            .footer-strip { height: 38px; }

            .footer-text {
                font-size: 10px;
                letter-spacing: 2.5px;
            }

            .bg-grid { background-size: 30px 30px; }
        }

        @media (max-width: 380px) {
            .header-strip { padding: 0 12px; }
            .header-logo { font-size: 15px; letter-spacing: 3px; }
            .wheel-wrapper { width: min(86vw, 46vh); }
            .dynamic-box { letter-spacing: 2px; }
            .picker-panel { width: min(88vw, 320px); }
            .edition-option { font-size: 9px; letter-spacing: 0.8px; }
        }

        @media (max-height: 650px) and (min-width: 701px) {
            .wheel-wrapper { width: min(68vh, 390px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-image, #bg-idle, .half-group, .half-path, .logo-img,
            .dynamic-box, .dynamic-box::before {
                transition-duration: 0.18s !important;
            }

            .ring-fast, .ring-slow, .ring-med, .core-pulse {
                animation-duration: 36s;
            }
        }

    </style>
</head>
<body>
    <div class="base-bg"></div>
    <div class="bg-container" id="background-layer">
        <div id="bg-idle" class="bg-image" aria-hidden="true"></div>
        <div id="bg-genshin" class="bg-image"></div>
        <div id="bg-minecraft" class="bg-image"></div>
    </div>
    <div class="bg-grid"></div>

    <header class="header-strip">
        <div class="header-logo">Core GG</div>
        <nav class="header-nav">
            <a href="https://www.instagram.com/otaku_krishna1/" target="_blank" rel="noopener noreferrer" class="nav-link support-tab" aria-label="Support on Instagram">Support</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="wheel-container">
            <div class="wheel-wrapper">
                <svg class="wheel-svg" viewBox="0 0 600 600">
                    <defs>
                        <linearGradient id="gold-neon" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFD700" />
                            <stop offset="100%" stop-color="transparent" />
                        </linearGradient>
                        <linearGradient id="green-neon" x1="100%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" stop-color="#32CD32" />
                            <stop offset="100%" stop-color="transparent" />
                        </linearGradient>

                        <clipPath id="clip-left">
                            <circle cx="170" cy="300" r="45"/>
                        </clipPath>
                        <clipPath id="clip-right">
                            <circle cx="430" cy="300" r="45"/>
                        </clipPath>
                    </defs>

                    <circle class="ring-fast" cx="300" cy="300" r="260" stroke="var(--neon-cyan)" stroke-width="1.5" stroke-dasharray="2 15 10 15" fill="none" opacity="0.7" filter="drop-shadow(0 0 4px var(--neon-cyan-glow))"/>
                    <circle class="ring-slow" cx="300" cy="300" r="240" stroke="url(#gold-neon)" stroke-width="3" stroke-dasharray="120 60 30 60" fill="none" filter="drop-shadow(0 0 6px var(--neon-gold-glow))"/>
                    <circle class="ring-med" cx="300" cy="300" r="220" stroke="url(#green-neon)" stroke-width="2" stroke-dasharray="90 30 15 30" fill="none" filter="drop-shadow(0 0 6px var(--neon-green-glow))"/>
                    <circle class="ring-slow" cx="300" cy="300" r="198" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="6 6" fill="none" />

                    <a href="coregenshin.html" id="genshin-link" aria-label="Open Genshin Impact">
                        <g class="half-group half-genshin" id="btn-genshin" aria-hidden="true">
                            <path class="half-path" d="M 296 120 
                                                       A 180 180 0 0 0 296 480 
                                                       L 296 380 
                                                       A 80 80 0 0 1 296 220 Z" />
                            <image class="logo-img" href="https://b.thumbs.redditmedia.com/82Mcyb68wCcglmF4t5ePl40F_a8nrPiaf5pCimG8FaU.jpg" xlink:href="https://b.thumbs.redditmedia.com/82Mcyb68wCcglmF4t5ePl40F_a8nrPiaf5pCimG8FaU.jpg" x="125" y="255" width="90" height="90" clip-path="url(#clip-left)" preserveAspectRatio="xMidYMid slice" />
                            <circle cx="170" cy="300" r="45" fill="none" stroke="var(--neon-gold)" stroke-width="2" opacity="0.5" />
                        </g>
                    </a>

                    <g class="half-group half-minecraft" id="btn-minecraft" role="button" tabindex="0" aria-label="Minecraft game preview">
                        <path class="half-path" d="M 304 120 
                                                   A 180 180 0 0 1 304 480 
                                                   L 304 380 
                                                   A 80 80 0 0 0 304 220 Z" />
                        <image class="logo-img" href="https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/logos/Icon_header.jpg" xlink:href="https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/logos/Icon_header.jpg" x="385" y="255" width="90" height="90" clip-path="url(#clip-right)" preserveAspectRatio="xMidYMid slice"/>
                        <circle cx="430" cy="300" r="45" fill="none" stroke="var(--neon-green)" stroke-width="2" opacity="0.5" />
                    </g>

                    <g class="core-pulse">
                        <circle cx="300" cy="300" r="70" fill="var(--ui-dark)" stroke="var(--neon-cyan)" stroke-width="2.5" />
                        <circle cx="300" cy="300" r="58" fill="none" stroke="rgba(0, 243, 255, 0.4)" stroke-width="1.5" stroke-dasharray="5 5" class="ring-fast"/>
                        
                        <text x="300" y="292" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="4" text-anchor="middle" filter="drop-shadow(0 0 5px rgba(255,255,255,0.5))">CORE</text>
                        <text x="300" y="322" fill="var(--neon-cyan)" font-family="Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="6" text-anchor="middle" filter="drop-shadow(0 0 5px var(--neon-cyan-glow))">GG</text>
                    </g>
                </svg>
            </div>

            <section class="picker-panel" id="edition-menu" role="group" aria-label="Choose Minecraft edition" aria-hidden="true">
                <div class="picker-heading">Choose your edition</div>
                <div class="picker-options">
                    <button class="edition-option" id="java-option" type="button">Java Edition</button>
                    <button class="edition-option" id="bedrock-option" type="button">Bedrock Edition</button>
                </div>
            </section>

            <section class="picker-panel" id="level-menu" role="group" aria-label="Choose experience level" aria-hidden="true">
                <div class="picker-heading" id="level-heading">Choose your path</div>
                <div class="picker-options">
                    <button class="edition-option" id="beginner-option" type="button">Beginner</button>
                    <button class="edition-option" id="professional-option" type="button">Professional</button>
                </div>
            </section>

            <div class="dynamic-box" id="info-box">System Standby</div>
        </div>
    </main>

    <footer class="footer-strip">
        <span class="footer-text">Thanks for visiting</span>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnGenshin = document.getElementById('btn-genshin');
            const genshinLink = document.getElementById('genshin-link');
            const btnMinecraft = document.getElementById('btn-minecraft');
            const backgroundLayer = document.getElementById('background-layer');
            const bgGenshin = document.getElementById('bg-genshin');
            const bgMinecraft = document.getElementById('bg-minecraft');
            const infoBox = document.getElementById('info-box');
            const wheelContainer = document.querySelector('.wheel-container');
            const editionMenu = document.getElementById('edition-menu');
            const levelMenu = document.getElementById('level-menu');
            const levelHeading = document.getElementById('level-heading');
            const javaOption = document.getElementById('java-option');
            const bedrockOption = document.getElementById('bedrock-option');
            const beginnerOption = document.getElementById('beginner-option');
            const professionalOption = document.getElementById('professional-option');
            const defaultText = 'System Standby';
            let selectedEdition = '';
            let launchTimer = null;

            function showGame(game) {
                backgroundLayer.classList.add('is-hovering');
                bgGenshin.style.opacity = game === 'genshin' ? '0.42' : '0';
                bgMinecraft.style.opacity = game === 'minecraft' ? '0.42' : '0';
                bgGenshin.style.transform = game === 'genshin' ? 'scale(1.035)' : 'scale(1)';
                bgMinecraft.style.transform = game === 'minecraft' ? 'scale(1.035)' : 'scale(1)';
                infoBox.textContent = game === 'genshin' ? 'Genshin Impact' : 'Minecraft';
                infoBox.className = 'dynamic-box ' + (game === 'genshin' ? 'active-genshin' : 'active-minecraft');
            }

            function resetBackground() {
                backgroundLayer.classList.remove('is-hovering');
                bgGenshin.style.opacity = '0';
                bgMinecraft.style.opacity = '0';
                bgGenshin.style.transform = 'scale(1)';
                bgMinecraft.style.transform = 'scale(1)';
                infoBox.textContent = defaultText;
                infoBox.className = 'dynamic-box';
            }

            function anyPickerOpen() {
                return editionMenu.classList.contains('is-open') || levelMenu.classList.contains('is-open');
            }

            function openEditionMenu() {
                if (launchTimer) { clearTimeout(launchTimer); launchTimer = null; }
                selectedEdition = '';
                showGame('minecraft');
                wheelContainer.classList.add('minecraft-menu-open');
                editionMenu.classList.add('is-open');
                editionMenu.setAttribute('aria-hidden', 'false');
                levelMenu.classList.remove('is-open');
                levelMenu.setAttribute('aria-hidden', 'true');
            }

            function closePickers(resetStatus = true) {
                wheelContainer.classList.remove('minecraft-menu-open');
                editionMenu.classList.remove('is-open');
                levelMenu.classList.remove('is-open');
                editionMenu.setAttribute('aria-hidden', 'true');
                levelMenu.setAttribute('aria-hidden', 'true');
                selectedEdition = '';
                if (launchTimer) { clearTimeout(launchTimer); launchTimer = null; }
                if (resetStatus) resetBackground();
            }

            function chooseEdition(edition) {
                selectedEdition = edition;
                showGame('minecraft');
                infoBox.textContent = 'Minecraft ' + edition + ' Edition';
                infoBox.className = 'dynamic-box active-minecraft';
                editionMenu.classList.remove('is-open');
                editionMenu.setAttribute('aria-hidden', 'true');
                levelHeading.textContent = edition + ' Edition · Choose your path';
                levelMenu.classList.add('is-open');
                levelMenu.setAttribute('aria-hidden', 'false');
            }

            function launchMinecraft(level) {
                if (!selectedEdition) return;
                if (launchTimer) clearTimeout(launchTimer);
                infoBox.textContent = 'Launching Minecraft';
                infoBox.className = 'dynamic-box active-minecraft';
                // Destination pages will be connected when they are created.
                // Keep the launch status visible instead of sending visitors to a broken link.
                launchTimer = setTimeout(() => {
                    infoBox.textContent = selectedEdition + ' · ' + level + ' selected';
                    launchTimer = null;
                }, 1250);
            }

            if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                btnGenshin.addEventListener('mouseenter', () => showGame('genshin'));
                btnMinecraft.addEventListener('mouseenter', () => { if (!anyPickerOpen()) showGame('minecraft'); });
                btnGenshin.addEventListener('mouseleave', () => { if (!anyPickerOpen()) resetBackground(); });
                btnMinecraft.addEventListener('mouseleave', () => { if (!anyPickerOpen()) resetBackground(); });
            }

            genshinLink.addEventListener('click', (event) => {
                event.preventDefault();
                closePickers(false);
                showGame('genshin');
                infoBox.textContent = 'Launching Genshin Impact';
                setTimeout(() => { window.location.href = 'coregenshin.html'; }, 1250);
            });

            btnMinecraft.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                if (anyPickerOpen()) closePickers(); else openEditionMenu();
            });

            btnMinecraft.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    if (anyPickerOpen()) closePickers(); else openEditionMenu();
                }
            });

            javaOption.addEventListener('click', (event) => { event.stopPropagation(); chooseEdition('Java'); });
            bedrockOption.addEventListener('click', (event) => { event.stopPropagation(); chooseEdition('Bedrock'); });
            beginnerOption.addEventListener('click', (event) => { event.stopPropagation(); launchMinecraft('Beginner'); });
            professionalOption.addEventListener('click', (event) => { event.stopPropagation(); launchMinecraft('Professional'); });

            document.addEventListener('click', (event) => {
                if (anyPickerOpen() && !wheelContainer.contains(event.target)) closePickers();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && anyPickerOpen()) closePickers();
            });

            window.addEventListener('pageshow', (event) => {
                closePickers(false);
                resetBackground();
                if (event.persisted) {
                    document.querySelectorAll('.ring-fast, .ring-slow, .ring-med, .core-pulse').forEach((part) => {
                        part.style.animation = 'none';
                        void part.getBoundingClientRect();
                        part.style.animation = '';
                    });
                }
            });
        });
    </script>
</body>
</html>
